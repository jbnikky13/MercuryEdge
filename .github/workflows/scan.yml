name: MercuryEdge Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "30 18 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MercuryEdge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MERCURY_PERIOD: 6mo
          MERCURY_INTERVAL: 1h
          MERCURY_MAX_SETUPS: 5
        run: python -m mercuryedge
