name: MercuryEdge Daily Trade Signals

on:
  schedule:
    # Run directly in Nigeria time so the schedule is self-documenting.
    - cron: "30 1 * * 1-5"
      timezone: "Africa/Lagos"
    - cron: "30 6 * * 1-5"
      timezone: "Africa/Lagos"
    - cron: "30 16 * * 1-5"
      timezone: "Africa/Lagos"
    - cron: "30 20 * * 1-5"
      timezone: "Africa/Lagos"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercuryedge-daily-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MercuryEdge signal engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MERCURY_PERIOD: 6mo
          MERCURY_INTERVAL: 1h
          MERCURY_MAX_SETUPS: 4
        run: |
          echo "Scheduled MercuryEdge signal run"
          date
          python -m mercuryedge

      - name: Persist signal journal
        run: |
          if [ -f data/journal.jsonl ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/journal.jsonl
            if ! git diff --cached --quiet; then
              git commit -m "chore: update MercuryEdge signal journal"
              git push
            fi
          fi
