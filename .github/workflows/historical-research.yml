name: Historical Market Research
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: mercuryedge-historical-research
  cancel-in-progress: false
env:
  PYTHONPATH: .
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch market history and replay current rules
        env:
          RESEARCH_HOURLY_PERIOD: "2y"
          RESEARCH_DAILY_PERIOD: "10y"
        run: python scripts/research_historical.py
      - name: Replay the scheduled live signal pipeline point-in-time
        run: python scripts/replay_live_pipeline.py
      - name: Discover recurring calendar and cross-market patterns
        run: python scripts/discover_recurring_patterns.py
      - name: Analyze non-overlapping trades and cost sensitivity
        run: python scripts/analyze_independent_research.py
      - name: Validate selector with chronological walk-forward tests
        env:
          WALK_FORWARD_TRAIN_DAYS: "365"
          WALK_FORWARD_TEST_DAYS: "90"
          WALK_FORWARD_STEP_DAYS: "90"
          WALK_FORWARD_HORIZON_HOURS: "24"
          WALK_FORWARD_MIN_TRAIN_TRADES: "30"
          WALK_FORWARD_SELECTION_COST_R: "0.05"
          WALK_FORWARD_MIN_TRAIN_EDGE_R: "0.02"
          WALK_FORWARD_COSTS_R: "0,0.05,0.10"
        run: python scripts/walk_forward_validation.py
      - name: Upload historical research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercuryedge-historical-research-${{ github.run_number }}
          path: research_data/
          if-no-files-found: warn
          retention-days: 90
