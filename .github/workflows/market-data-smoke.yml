name: MercuryEdge Market Data Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install market-data dependencies
        run: pip install -r requirements.txt
      - name: Check Yahoo Finance data path (read-only)
        env:
          PYTHONPATH: .
        run: python market_data_smoke_test.py
